kind = "web"
previewPath = "/opp-builder/"
title = "Opportunity Builder"
version = "1.0.0"
id = "artifacts/opp-builder"
router = "path"

[[services]]
name = "web"
paths = [ "/opp-builder/" ]
localPort = 21000

[services.development]
run = "pnpm --filter @workspace/opp-builder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/opp-builder", "run", "build" ]
serve = "static"
publicDir = "artifacts/opp-builder/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21000"
BASE_PATH = "/opp-builder/"
