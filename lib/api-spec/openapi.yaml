openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: admin-opportunities
    description: Admin opportunity management
  - name: admin-employers
    description: Admin employer configuration

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout (revokes session)
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /admin/opportunities:
    get:
      operationId: listAdminOpportunities
      tags: [admin-opportunities]
      summary: List all opportunities with author info
      parameters:
        - in: query
          name: category
          schema:
            type: string
            enum: [CARE_SITE_ALTERNATIVE, CARE_PROTOCOL, PREVENTATIVE_CARE, CARE_QUALITY]
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: createOpportunity
      tags: [admin-opportunities]
      summary: Create a new opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /admin/opportunities/stats:
    get:
      operationId: getOpportunityStats
      tags: [admin-opportunities]
      summary: Get aggregate opportunity statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityStats"

  /admin/opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [admin-opportunities]
      summary: Get a single opportunity with full author history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDetail"
        "404":
          description: Not found
    patch:
      operationId: updateOpportunity
      tags: [admin-opportunities]
      summary: Update opportunity fields
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "404":
          description: Not found
    delete:
      operationId: deactivateOpportunity
      tags: [admin-opportunities]
      summary: Soft-deactivate an opportunity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /admin/employers:
    get:
      operationId: listEmployers
      tags: [admin-employers]
      summary: List all employers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employer"

  /admin/employers/{employerId}/configs:
    get:
      operationId: listEmployerConfigs
      tags: [admin-employers]
      summary: List opportunity configs for an employer (one row per opportunity)
      parameters:
        - in: path
          name: employerId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployerOpportunityConfig"

  /admin/employers/{employerId}/configs/{opportunityId}:
    put:
      operationId: setEmployerConfig
      tags: [admin-employers]
      summary: Upsert employer config for a specific opportunity
      parameters:
        - in: path
          name: employerId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: opportunityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployerConfigInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployerOpportunityConfig"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string }

    AuthResponse:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        accessToken: { type: string }
        refreshToken: { type: string }

    Opportunity:
      type: object
      required: [id, title, description, category, pointsValue, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        category:
          type: string
          enum: [CARE_SITE_ALTERNATIVE, CARE_PROTOCOL, PREVENTATIVE_CARE, CARE_QUALITY]
        subCategory: { type: ["string", "null"] }
        pointsValue: { type: integer }
        logoUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdBy: { type: ["string", "null"] }
        createdByName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        authorCount: { type: integer }

    OpportunityDetail:
      type: object
      required: [id, title, description, category, pointsValue, isActive, createdAt, authors]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        category:
          type: string
          enum: [CARE_SITE_ALTERNATIVE, CARE_PROTOCOL, PREVENTATIVE_CARE, CARE_QUALITY]
        subCategory: { type: ["string", "null"] }
        pointsValue: { type: integer }
        logoUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdBy: { type: ["string", "null"] }
        createdByName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        authors:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityAuthorEntry"

    OpportunityAuthorEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: ["string", "null"] }
        authorName: { type: string }
        action:
          type: string
          enum: [CREATED, UPDATED, DEACTIVATED, REACTIVATED]
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    OpportunityInput:
      type: object
      required: [title, description, category, pointsValue]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        category:
          type: string
          enum: [CARE_SITE_ALTERNATIVE, CARE_PROTOCOL, PREVENTATIVE_CARE, CARE_QUALITY]
        subCategory: { type: string }
        pointsValue: { type: integer, minimum: 1 }
        logoUrl: { type: string }

    OpportunityUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        category:
          type: string
          enum: [CARE_SITE_ALTERNATIVE, CARE_PROTOCOL, PREVENTATIVE_CARE, CARE_QUALITY]
        subCategory: { type: string }
        pointsValue: { type: integer, minimum: 1 }
        logoUrl: { type: string }
        isActive: { type: boolean }
        notes: { type: string }

    CategoryCount:
      type: object
      required: [category, count]
      properties:
        category: { type: string }
        count: { type: integer }

    OpportunityStats:
      type: object
      required: [total, totalActive, totalInactive, byCategory]
      properties:
        total: { type: integer }
        totalActive: { type: integer }
        totalInactive: { type: integer }
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        recentlyCreated:
          type: array
          items:
            $ref: "#/components/schemas/Opportunity"

    Employer:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        planType: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"], format: date-time }
        configuredCount: { type: integer }

    EmployerOpportunityConfig:
      type: object
      required: [id, employerId, opportunityId, isEnabled]
      properties:
        id: { type: string, format: uuid }
        employerId: { type: string, format: uuid }
        opportunityId: { type: string, format: uuid }
        isEnabled: { type: boolean }
        customPointsValue: { type: ["integer", "null"] }
        customTitle: { type: ["string", "null"] }
        updatedBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        opportunity:
          $ref: "#/components/schemas/Opportunity"

    EmployerConfigInput:
      type: object
      required: [isEnabled]
      properties:
        isEnabled: { type: boolean }
        customPointsValue: { type: integer }
        customTitle: { type: string }
